[package]
name = "caret"
version = "0.1.0"
edition = "2024"
authors = ["you"]
description = "Cross-platform caret position detection library"

[dependencies]
tauri = { version = "2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
